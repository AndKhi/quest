<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квест-квиз по Праге — След алхимика</title>
  <style>
    :root {
      --bg: #111014;
      --card: #1b1820;
      --card2: #241f2b;
      --text: #f4efe7;
      --muted: #b9ad9f;
      --gold: #d7a84f;
      --red: #9c3f3f;
      --green: #4f8f68;
      --line: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(215,168,79,0.16), transparent 35%),
        linear-gradient(180deg, #151219 0%, #0e0d10 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(920px, 100%);
    }

    .card {
      background: linear-gradient(180deg, rgba(36,31,43,0.98), rgba(24,22,28,0.98));
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .hero {
      padding: 34px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(156,63,63,0.18), transparent),
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
    }

    .kicker {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.02;
      margin-bottom: 14px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      max-width: 760px;
    }

    .content { padding: 30px 34px 34px; }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .pill strong {
      display: block;
      color: var(--text);
      margin-bottom: 4px;
    }

    .place {
      color: var(--gold);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h2 {
      font-size: clamp(24px, 4vw, 38px);
      margin-bottom: 14px;
    }

    .question {
      font-size: 22px;
      line-height: 1.35;
      margin: 18px 0 20px;
    }

    .options {
      display: grid;
      gap: 12px;
      margin: 20px 0;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 16px;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .option {
      text-align: left;
      padding: 16px 18px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .option:hover { transform: translateY(-1px); background: rgba(255,255,255,0.09); }
    .option.correct { border-color: rgba(79,143,104,0.9); background: rgba(79,143,104,0.18); }
    .option.wrong { border-color: rgba(156,63,63,0.95); background: rgba(156,63,63,0.18); }
    .option:disabled { cursor: default; opacity: 0.86; }

    .block {
      display: none;
      margin-top: 18px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
      border-radius: 20px;
      padding: 18px;
    }

    .block.visible { display: block; }

    .label {
      color: var(--gold);
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .block p, .intro-text p {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .hint-link {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--text);
      background: rgba(215,168,79,0.12);
      border: 1px solid rgba(215,168,79,0.35);
      padding: 11px 14px;
      border-radius: 14px;
      text-decoration: none;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .primary {
      background: var(--gold);
      color: #18120b;
      padding: 14px 20px;
      font-weight: 800;
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 14px 20px;
      font-weight: 700;
    }

    .primary:hover, .secondary:hover { transform: translateY(-1px); }

    .progress {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), #f0d38a);
      transition: width 0.25s ease;
    }

    .score {
      color: var(--muted);
      margin-top: 12px;
      font-size: 15px;
    }

    .route {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 4px;
    }

    .route span {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 13px;
      border: 1px solid var(--line);
    }

    .hidden { display: none; }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .hero, .content { padding: 24px; }
      .meta { grid-template-columns: 1fr; }
      .question { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="hero">
        <div class="kicker">Городской квест-квиз</div>
        <h1>Прага: след алхимика</h1>
        <p class="subtitle">Маршрут по главным местам Праги. Каждый вопрос появляется по одному. После ответа откроется пояснение, подсказка и ссылка на картинки следующей точки.</p>
      </div>

      <div class="content" id="screen"></div>
    </section>
  </main>

  <script>
    const quiz = [
      {
        place: "Точка 1 — Староместская площадь",
        title: "Орлой и апостолы",
        instruction: "Идите на Староместскую площадь. Лучше прийти за 5–10 минут до начала часа.",
        question: "Почему люди на площади каждый час резко смотрят вверх?",
        options: [
          "Из башни играют музыканты",
          "На башне появляются фигурки апостолов",
          "На крыше зажигают огонь",
          "Там появляется император"
        ],
        correct: 1,
        explanation: "На пражском Орлое каждый час открываются маленькие окна и появляются апостолы. Часам больше 600 лет, и они стали одним из главных символов старой Праги. Во времена Рудольфа II город особенно связывали с астрономией, алхимией и тайными знаниями.",
        hint: "Чтобы попасть в королевскую часть города, людям нужно было перейти реку по главному мосту Праги. Ищите место, которое начинается с высокой готической башни у входа на мост.",
        imageLabel: "Картинки следующего места",
        imageUrl: "https://www.google.com/search?tbm=isch&q=Old+Town+Bridge+Tower+Prague"
      },
      {
        place: "Точка 2 — Карлов мост",
        title: "Главный переход через Влтаву",
        instruction: "Найдите мост, который начинается у готической Староместской мостовой башни.",
        question: "Почему этот мост был самым важным местом средневековой Праги?",
        options: [
          "Здесь проводили турниры",
          "Это был главный переход через реку",
          "Здесь жил король",
          "Здесь находился рынок золота"
        ],
        correct: 1,
        explanation: "Карлов мост веками был главным переходом через Влтаву. Через него проходили торговцы, путешественники и королевские процессии. Это не просто мост, а связка между Старым городом и дорогой к Пражскому Граду.",
        hint: "Теперь сверните в старый квартал рядом с рекой. Следующая часть связана с узкими улицами и легендой о существе из глины.",
        imageLabel: "Картинки следующего места",
        imageUrl: "https://www.google.com/search?tbm=isch&q=Josefov+Prague+Jewish+Quarter+streets"
      },
      {
        place: "Точка 3 — Еврейский квартал",
        title: "Легенда о Големе",
        instruction: "Идите в район Йозефов — старый еврейский квартал Праги.",
        question: "Как звали существо, которое, по легенде, защищало этот район Праги?",
        options: [
          "Василиск",
          "Голем",
          "Феникс",
          "Левиафан"
        ],
        correct: 1,
        explanation: "Легенда о Големе связана с пражским еврейским кварталом. Считалось, что раввин Лёв создал существо из глины для защиты жителей. Это одна из причин, почему Прага воспринимается как город легенд, мистики и старых тайн.",
        hint: "Алхимиков интересовали не только легенды. Их тянуло к месту власти — туда, что стоит высоко над городом, видно почти из центра и узнаётся по огромному собору.",
        imageLabel: "Картинки следующего места",
        imageUrl: "https://www.google.com/search?tbm=isch&q=Prague+Castle+St+Vitus+Cathedral+skyline"
      },
      {
        place: "Точка 4 — Пражский Град",
        title: "Город сверху",
        instruction: "Поднимитесь к Пражскому Граду и собору Святого Вита.",
        question: "Почему правители Праги построили резиденцию именно здесь?",
        options: [
          "Отсюда видно весь город",
          "Здесь добывали золото",
          "Здесь теплее",
          "Здесь был рынок"
        ],
        correct: 0,
        explanation: "Пражский Град столетиями был центром власти. Высота давала обзор, защиту и контроль над городом. При Рудольфе II здесь собирались учёные, астрологи и алхимики со всей Европы.",
        hint: "Финальная точка не во дворце. Ищите маленькую сказочную улицу с низкими цветными домиками рядом с крепостной стеной.",
        imageLabel: "Картинки следующего места",
        imageUrl: "https://www.google.com/search?tbm=isch&q=Golden+Lane+Prague+colorful+houses"
      },
      {
        place: "Финал — Злата улочка",
        title: "Философский камень",
        instruction: "Найдите Злату улочку внутри комплекса Пражского Града.",
        question: "Что, по легендам, пытались найти алхимики Рудольфа II?",
        options: [
          "Машину времени",
          "Философский камень",
          "Тайную библиотеку",
          "Лекарство от бессонницы"
        ],
        correct: 1,
        explanation: "Алхимики верили, что философский камень поможет превращать металлы в золото и раскрыть тайны природы. Прага получила мистический образ именно из-за сочетания старого города, астрономии, алхимии, легенд о Големе и готической архитектуры.",
        hint: "Квест завершён. Финальный ответ: Прага кажется мистической, потому что здесь история, легенды и архитектура постоянно смешиваются между собой.",
        imageLabel: "Картинки финального места",
        imageUrl: "https://www.google.com/search?tbm=isch&q=Golden+Lane+Prague"
      }
    ];

    let current = -1;
    let score = 0;
    let answered = false;

    const screen = document.getElementById("screen");

    function startScreen() {
      screen.innerHTML = `
        <div class="meta">
          <div class="pill"><strong>Город</strong>Прага</div>
          <div class="pill"><strong>Тема</strong>Алхимия, легенды, власть</div>
          <div class="pill"><strong>Формат</strong>5 точек, вопросы по одному</div>
        </div>
        <div class="intro-text">
          <p>Сюжет: вы идёте по следу придворного алхимика Рудольфа II. Каждая точка раскрывает часть ответа на главный вопрос: почему Прагу считают мистическим городом?</p>
          <p>После каждого ответа появится пояснение и подсказка следующего места. Ссылка ведёт на Google Images, чтобы игрок мог узнать визуальный ориентир.</p>
        </div>
        <div class="route">
          <span>Староместская площадь</span>
          <span>Карлов мост</span>
          <span>Еврейский квартал</span>
          <span>Пражский Град</span>
          <span>Злата улочка</span>
        </div>
        <div class="actions">
          <button class="primary" onclick="nextQuestion()">Начать квест</button>
        </div>
      `;
    }

    function renderQuestion() {
      const q = quiz[current];
      const progress = ((current) / quiz.length) * 100;
      answered = false;

      screen.innerHTML = `
        <div class="progress"><div class="bar" style="width:${progress}%"></div></div>
        <div class="place">${q.place}</div>
        <h2>${q.title}</h2>
        <div class="block visible">
          <div class="label">Как попасть сюда</div>
          <p>${q.instruction}</p>
        </div>
        <div class="question">${q.question}</div>
        <div class="options">
          ${q.options.map((opt, i) => `<button class="option" onclick="selectAnswer(${i})">${String.fromCharCode(65 + i)}) ${opt}</button>`).join("")}
        </div>
        <div class="block" id="explanation">
          <div class="label">Пояснение</div>
          <p>${q.explanation}</p>
          <div class="label" style="margin-top:14px;">Подсказка следующего места</div>
          <p>${q.hint}</p>
          <a class="hint-link" target="_blank" rel="noopener" href="${q.imageUrl}">Открыть: ${q.imageLabel}</a>
        </div>
        <div class="actions hidden" id="actions">
          ${current < quiz.length - 1 ? `<button class="primary" onclick="nextQuestion()">Следующий вопрос</button>` : `<button class="primary" onclick="finishQuiz()">Показать финал</button>`}
          <button class="secondary" onclick="restartQuiz()">Начать заново</button>
        </div>
        <div class="score">Вопрос ${current + 1} из ${quiz.length}</div>
      `;
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;

      const q = quiz[current];
      const buttons = Array.from(document.querySelectorAll(".option"));
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add("correct");
        if (i === index && i !== q.correct) btn.classList.add("wrong");
      });

      if (index === q.correct) score++;
      document.getElementById("explanation").classList.add("visible");
      document.getElementById("actions").classList.remove("hidden");
    }

    function nextQuestion() {
      current++;
      renderQuestion();
    }

    function finishQuiz() {
      screen.innerHTML = `
        <div class="progress"><div class="bar" style="width:100%"></div></div>
        <div class="place">Финал</div>
        <h2>Почему Прага кажется мистической?</h2>
        <div class="block visible">
          <div class="label">Итог</div>
          <p>Вы прошли маршрут через часы, мост, еврейский квартал, замок и Злату улочку.</p>
          <p>Ответ: Прага воспринимается мистической, потому что в ней на коротком маршруте смешиваются средневековая архитектура, астрономия, власть, алхимия и легенды о Големе.</p>
          <p>Результат: ${score} из ${quiz.length} правильных ответов.</p>
        </div>
        <div class="actions">
          <button class="primary" onclick="restartQuiz()">Пройти заново</button>
        </div>
      `;
    }

    function restartQuiz() {
      current = -1;
      score = 0;
      answered = false;
      startScreen();
    }

    startScreen();
  </script>
</body>
</html>
